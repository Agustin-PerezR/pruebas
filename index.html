<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liga de Fútbol - Tabla de Posiciones</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo-area">
        <span class="badge-liga">🏆</span>
        <div>
          <h1>Liga Premier de Fútbol</h1>
          <p class="season-info" id="temporada-subtitulo">Temporada Regular (10 Clubes)</p>
        </div>
      </div>
      <nav class="nav-tabs" aria-label="Navegación de Liga">
        <button class="tab-btn active" id="tab-posiciones">Tabla de Posiciones</button>
        <button class="tab-btn" id="tab-fixture">Fixture y Resultados</button>
        <button class="tab-btn" id="tab-stats">Goleadores / Asistencias</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="actions-bar">
      <div>
        <h2 style="font-size: 1.25rem; font-weight: 700;" id="seccion-titulo">Clasificación General</h2>
        <p class="season-info" id="info-partidos">18 jornadas disputadas • 90 partidos jugados</p>
      </div>
      <button class="btn-primary" id="btn-nueva-temporada">
        <span>🔄</span> Simular Nueva Temporada
      </button>
    </section>

    <!-- Contenedor dinámico de la tabla de posiciones -->
    <section id="tabla-wrapper" class="vista-seccion" aria-label="Tabla de Posiciones de la Liga">
      <!-- Inyectado dinámicamente por js/app.js -->
    </section>

    <!-- Contenedor dinámico del fixture y resultados -->
    <section id="fixture-wrapper" class="vista-seccion hidden" aria-label="Fixture y Resultados de Partidos">
      <!-- Inyectado dinámicamente por js/fixture-view.js -->
    </section>

    <!-- Contenedor dinámico de estadísticas de jugadores -->
    <section id="stats-wrapper" class="vista-seccion hidden" aria-label="Estadísticas de Goleadores y Asistencias">
      <!-- Inyectado dinámicamente por js/stats.js -->
    </section>

    <!-- Contenedor del Modal de Detalle de Partido -->
    <div id="modal-container"></div>
  </main>

  <footer>
    <p>Liga de Fútbol • Simulación automática sin inicio de sesión • Scrum Master AI</p>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/simulator.js"></script>
  <script src="js/standings.js"></script>
  <script src="js/fixture-view.js"></script>
  <script src="js/match-modal.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
